name: vuln

# govulncheck reports only vulnerabilities the code can reach. CI calls this
# on every change; the weekly run covers an advisory landing with nothing
# here changing.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make audit
